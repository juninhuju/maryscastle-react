[build]
  command = "npm run build"
  publish = "dist"

# Redirecionamento SPA (necessário para rotas React não darem 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/old-path"
  to = "/new-path"
  status = 301

# Headers padrão de segurança e no-cache para o HTML
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache longo e imutável apenas para assets estáticos gerados com hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Plugins
[[plugins]]
  package = "netlify-plugin-sitemap"

[[plugins]]
  package = "netlify-plugin-robots-txt"
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/old-path"
  to = "/new-path"
  status = 301

[headers]
  [[headers]]
    for = "/**"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[build.plugins]
  [[build.plugins]]
    package = "netlify-plugin-sitemap"
  [[build.plugins]]
    package = "netlify-plugin-robots-txt"
